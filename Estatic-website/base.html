<!DOCTYPE html>
<html lang = "pt-BR"></html>
<head>
    <meta charset="UTF-8">
    <title>{{ pagina_titulo }} </title>
    <style>
        body { font-family: Arial, sans-serif; margin: 40px;
        background-color: white;}
        h1 {color: black;}
        .card {background: white;padding: 20px;
        border-collapse: collapse ; margin-top: 20px;}
        th,td {padding: 10px; border-bottom: 1px solid blanchedalmond;text-align: left;}
        th {background-color: lightslategrey; color: lightsteelblue;}
    </style>
</head>
<body>
    <h1> {{pagina_titulo}}</h1>
    <div class="card">
        <h2>Resumo mensal</h2>
        <p><strong> Total vendas:</strong>R$ {{faturamento}} </p>
    </div>

    <h3>Principais Produtos </h3>
    <table>
        <tr>
            <th>Produto</th>
            <th>Quantidade</th>
        </tr>
        {% for produto in produtos_destaque %}
        <tr>
            <td> {{produto.nome}}</td>
            <td> {{produto.qtd}}</td>
        </tr>
        {% endfor %}
    </table>
</body>
</html>
