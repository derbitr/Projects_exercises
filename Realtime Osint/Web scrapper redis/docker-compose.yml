version: '3.8'

services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
  api:
    build:
    command: uvicorn main:app --host 0.0.0.0 --ports 8000
    volumes:
      - .:/app
    ports:
      - "8100"
    environment:
      - BASE_URL=redis://redis:6379/0
      - BACK_URL =redis://redis:6379/1
    depends_on:
      - redis
  worker:
    build: .
    command: celery -A v3worker --loglevel = info -P solo
    volumes:
      - .:/app
    environment:
      - BASE_URL=redis://redis:6379/0
      - BACK_URL=redis://redis:6379/1
    depends_on:
      - redis

