version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: postgres.db
    restart : always
    environment:
      POSTGRES_USER : ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD : ${POSTGRES_PASSUORD:-secrets}
      POSTGRES_DB : ${POSTGRES_DB:-ecommerce}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  app:
    build: .
    container_name: fast_api_app
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://postgres:secret@db:5432/ecommerce
      STRIPE_API_KEY: ${STRIPE_API_KEY}
      STRIPE_WEBHOK_SECRET: ${STRIPE_WEBHOOK_SECRET}
    depends_on:
    - db
volumes:
  postgres_data:

  